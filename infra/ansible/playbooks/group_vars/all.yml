# Куда кладём проект на сервере
deploy_dir: /opt/mp

# Порт фронта (nginx), единственный порт, который нужен снаружи
http_port: 80

# true только за HTTPS, иначе браузер не сохранит refresh-cookie
cookie_secure: false

# Эти email при регистрации станут admin
admin_emails: ""

# Docker Hub из РФ бывает недоступен — зеркала. [] — без зеркал.
docker_registry_mirrors:
  - https://mirror.gcr.io

# Пароли и JWT-секрет генерируются при первом деплое и лежат тут (в .gitignore).
# Не удаляй, иначе на сервере поменяются пароли БД.
secrets_dir: "{{ playbook_dir }}/../.secrets"
