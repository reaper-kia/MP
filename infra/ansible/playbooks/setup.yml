# Подготовка сервера: Docker + compose + buildx, зеркала реестра, firewall.
# Запускается один раз на новый сервер: make server-setup
- name: Prepare server
  hosts: "{{ target | default('app') }}"
  become: true

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name: [ca-certificates, curl, rsync, git, python3]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Install Docker from distro repositories
      ansible.builtin.apt:
        name: [docker.io, docker-compose-v2, docker-buildx]
        state: present
      register: docker_pkgs
      ignore_errors: true

    - name: Fallback to get.docker.com if distro packages are missing
      when: docker_pkgs is failed
      ansible.builtin.shell: curl -fsSL https://get.docker.com | sh
      args:
        creates: /usr/bin/docker

    - name: Configure registry mirrors
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: "{{ {'registry-mirrors': docker_registry_mirrors} | to_nice_json }}"
        mode: "0644"
      when: docker_registry_mirrors | length > 0
      notify: Restart docker

    - name: Enable docker
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

    - name: Add deploy user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
      when: ansible_user is defined and ansible_user != 'root'

    - name: Firewall
      when: configure_firewall | bool
      block:
        - name: Install ufw
          ansible.builtin.apt:
            name: ufw
            state: present
        - name: Allow ports
          community.general.ufw:
            rule: allow
            port: "{{ item }}"
            proto: tcp
          loop: ["22", "{{ http_port | string }}", "443"]
        - name: Enable ufw
          community.general.ufw:
            state: enabled
      rescue:
        - name: Firewall skipped
          ansible.builtin.debug:
            msg: "ufw не настроен (нет community.general?) — проверь вручную: sudo ufw status"

  handlers:
    - name: Restart docker
      ansible.builtin.systemd_service:
        name: docker
        state: restarted
