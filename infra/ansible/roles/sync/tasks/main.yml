---
# Копируем текущую папку проекта (включая незакоммиченное) — git на сервере не нужен
- name: Ensure deploy dir
  ansible.builtin.file:
    path: "{{ deploy_dir }}"
    state: directory
    mode: "0755"

- name: Sync project
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../../../"
    dest: "{{ deploy_dir }}/"
    delete: true
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=.venv"
      - "--exclude=__pycache__"
      - "--exclude=.pytest_cache"
      - "--exclude=.mypy_cache"
      - "--exclude=.ruff_cache"
      - "--exclude=node_modules"
      - "--exclude=frontend/dist"
      - "--exclude=infra/ansible/.secrets"
      - "--exclude=.env"
      # токен VK ID у сервера свой (make vk-login): refresh_token одноразовый, общий файл с
      # локальным стендом ломал бы вход обоим — кто обновил первым, у другого вход пропадает
      - "--exclude=.vk/token.json"
      - "--exclude=.vk/token.tmp"
      - "--exclude=.vk_token.json"
      - "--exclude=.diagnose"
      - "--exclude=.ml_check"
