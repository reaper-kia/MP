---
# если на сервере включён ufw — открыть порт сайта (облачный файрвол провайдера так не открыть)
- name: Open HTTP port in ufw (if active)
  ansible.builtin.shell: |
    if ufw status 2>/dev/null | grep -q "Status: active"; then ufw allow {{ http_port }}/tcp; else echo "ufw off"; fi
  args:
    executable: /bin/bash
  changed_when: false

- name: Build and start containers
  ansible.builtin.command:
    cmd: docker compose up -d --build --remove-orphans
    chdir: "{{ deploy_dir }}"
  environment:
    DOCKER_BUILDKIT: "{{ '0' if docker_classic_builder else '1' }}"
    COMPOSE_BAKE: "false"
  changed_when: true

- name: Wait until all services are ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ http_port }}/health/ready"
    return_content: true
  register: ready
  until: ready.status == 200 and ready.json.status == 'ok'
  retries: 30
  delay: 5
  failed_when: false

- name: Result
  ansible.builtin.debug:
    msg:
      - "App:     http://{{ ansible_host | default(inventory_hostname) }}:{{ http_port }}"
      - "Swagger: http://{{ ansible_host | default(inventory_hostname) }}:{{ http_port }}/docs"
      - "Ready:   {{ ready.json | default('не поднялось — смотри: docker compose logs') }}"
