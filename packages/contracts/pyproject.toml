[project]
name = "mp-contracts"
version = "0.1.0"
description = "Сгенерированный из contracts/*.proto Python-код. Руками не править — make proto."
requires-python = ">=3.13"
dependencies = [
    "grpcio>=1.83.0,<2",
    "protobuf>=7.35.1,<8",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "contracts"
