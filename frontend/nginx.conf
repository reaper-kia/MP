server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # Docker DNS: gateway резолвится на каждый запрос, nginx не падает, если gateway ещё стартует
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:8000;

    location /api/ {
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Swagger и health тоже через этот же порт: http://<server>/docs
    location ~ ^/(docs|openapi\.json|health/) {
        proxy_pass $gateway;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
