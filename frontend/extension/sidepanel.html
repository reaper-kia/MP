<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>МедиаПульс</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="bar">
      <button id="add" class="add" type="button" disabled>Добавить эту страницу как источник</button>
      <button id="toggle-settings" class="icon" type="button" title="Адрес сервера" aria-label="Адрес сервера" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" />
        </svg>
      </button>
    </header>
    <p id="page" class="page">Откройте страницу группы или канала</p>
    <form id="settings" class="settings" hidden>
      <label for="server">Адрес сервера МедиаПульс</label>
      <div class="row">
        <input id="server" type="url" required placeholder="http://адрес-сервера" />
        <button type="submit">Сохранить</button>
      </div>
    </form>
    <iframe id="app" title="МедиаПульс"></iframe>
    <script src="config.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
