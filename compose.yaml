name: mp

services:
  # ───────── вход снаружи ─────────
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80" # nginx: статика фронта + прокси /api, /ws, /docs → gateway
    depends_on:
      - gateway

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-it-must-be-at-least-32-bytes}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AUTH_GRPC_TARGET: auth_service:50051
      EXAMPLE_GRPC_TARGET: example_service:50052
    ports:
      - "8000:8000" # Swagger: http://localhost:8000/docs
    depends_on:
      - auth_service
      - example_service

  # ───────── auth ─────────
  auth_service:
    build:
      context: .
      dockerfile: services/auth_service/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://auth:${AUTH_DB_PASSWORD:-auth_local}@auth_db:5432/auth
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-it-must-be-at-least-32-bytes}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    ports:
      - "127.0.0.1:50051:50051"
    depends_on:
      auth_db:
        condition: service_healthy

  auth_db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-auth_local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ───────── example ─────────
  example_service:
    build:
      context: .
      dockerfile: services/example_service/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://example:${EXAMPLE_DB_PASSWORD:-example_local}@example_db:5432/example
      AUTH_GRPC_TARGET: auth_service:50051
    ports:
      - "127.0.0.1:50052:50052"
    depends_on:
      example_db:
        condition: service_healthy

  example_db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: example
      POSTGRES_USER: example
      POSTGRES_PASSWORD: ${EXAMPLE_DB_PASSWORD:-example_local}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - example_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U example -d example"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  auth_db_data:
  example_db_data:
