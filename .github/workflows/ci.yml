name: CI

on: [push, pull_request]

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        service:
          - search_service
          - collector_service
          - ml_service
          - gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy src
      - name: tests
        run: uv run pytest

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
      - name: Generate code
        run: uv run --project services/gateway python scripts/generate_proto.py
      - name: Generated code is up to date
        run: git diff --exit-code -- packages/platform_contracts
      - name: Generate reference docs
        run: |
          uv run --project services/gateway python scripts/gen_api_docs.py
          uv run --project services/gateway python scripts/gen_grpc_docs.py
      - name: Reference docs are up to date
        run: git diff --exit-code -- docs/API.md docs/api-types.ts docs/GRPC.md

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cp .env.example .env && docker compose config -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
