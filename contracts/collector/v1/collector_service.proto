syntax = "proto3";

package collector.v1;

import "common/v1/common.proto";
import "common/v1/platform.proto";
import "google/protobuf/timestamp.proto";

// Получение публикаций с площадок. Владелец — B1.
// Своей БД нет. Возвращает ТОЛЬКО реально полученные с площадки посты:
// ссылка, текст и дата берутся из ответа площадки, ничего не генерируется.
//
// Ошибки (gRPC status + error-code в trailing metadata, как в шаблоне):
//   UNSUPPORTED_URL       INVALID_ARGUMENT     ссылка не похожа на группу/канал поддерживаемой площадки
//   SOURCE_NOT_FOUND      NOT_FOUND            группы/канала не существует
//   SOURCE_PRIVATE        FAILED_PRECONDITION  закрытая группа, контент недоступен
//   PLATFORM_UNAVAILABLE  UNAVAILABLE          площадка/ключ недоступны
//   RATE_LIMITED          RESOURCE_EXHAUSTED   упёрлись в лимит
service CollectorService {
  // Какие площадки и режимы сейчас доступны (для UI и для search_service)
  rpc GetPlatforms(GetPlatformsRequest) returns (GetPlatformsResponse);
  // Ссылка от пользователя → нормализованная карточка источника
  rpc ResolveSource(ResolveSourceRequest) returns (ResolveSourceResponse);
  // Режим «по выбранным источникам»: посты одного источника за период
  rpc CollectFromSource(CollectFromSourceRequest) returns (CollectFromSourceResponse);
  // Режим «без ограничения списком»: поиск по всей площадке
  rpc SearchPlatform(SearchPlatformRequest) returns (SearchPlatformResponse);
}

enum PlatformHealth {
  PLATFORM_HEALTH_UNSPECIFIED = 0;
  PLATFORM_HEALTH_OK = 1;
  // работает частично (например, нет глобального поиска)
  PLATFORM_HEALTH_DEGRADED = 2;
  PLATFORM_HEALTH_UNAVAILABLE = 3;
}

message PlatformInfo {
  common.v1.Platform platform = 1;
  string title = 2;
  bool source_mode_supported = 3;
  bool global_mode_supported = 4;
  PlatformHealth health = 5;
  // Пояснение для пользователя: «глобальный поиск через Яндекс», «нет ключа API» и т.п.
  string note = 6;
}

message GetPlatformsRequest {
  common.v1.RequestContext context = 1;
}

message GetPlatformsResponse {
  repeated PlatformInfo platforms = 1;
}

// Источник: группа VK / группа OK / канал MAX / сайт
message SourceInfo {
  common.v1.Platform platform = 1;
  // Стабильный id на площадке: VK owner_id (-123), OK gid, MAX channel id/handle, домен сайта
  string external_id = 2;
  // Короткое имя: vk.com/<screen_name>, max.ru/<handle>
  string screen_name = 3;
  // Каноничная ссылка на источник
  string url = 4;
  string name = 5;
  optional string city = 6;
  optional int64 members_count = 7;
  bool is_closed = 8;
}

message ResolveSourceRequest {
  common.v1.RequestContext context = 1;
  // Любая форма ссылки: vk.com/club1, https://vk.com/krsk_news, ok.ru/group/123, max.ru/handle
  string url = 2;
}

message ResolveSourceResponse {
  SourceInfo source = 1;
}

message PostMetrics {
  optional int64 views = 1;
  optional int64 likes = 2;
  optional int64 reposts = 3;
  optional int64 comments = 4;
}

// Нормализованная публикация. Ключ уникальности:
// (platform, source_external_id, post_external_id).
message RawPost {
  common.v1.Platform platform = 1;
  string source_external_id = 2;
  string source_name = 3;
  string source_url = 4;
  string post_external_id = 5;
  // Прямая каноничная ссылка на пост: https://vk.com/wall-123_456, https://ok.ru/group/1/topic/2
  string url = 6;
  // Заголовок, если площадка его отдаёт (статья, сайт). Иначе пусто — заголовок из начала поста делает search.
  optional string title = 7;
  // Полный текст поста как на площадке (без HTML). Для репоста — текст + текст оригинала.
  string text = 8;
  // Нет даты — поле не заполняется. Никогда не подставлять «сейчас».
  optional google.protobuf.Timestamp published_at = 9;
  PostMetrics metrics = 10;
  bool is_repost = 11;
  optional string repost_of_url = 12;
  google.protobuf.Timestamp fetched_at = 13;
}

message CollectFromSourceRequest {
  common.v1.RequestContext context = 1;
  common.v1.Platform platform = 2;
  string source_external_id = 3;
  common.v1.Period period = 4;
  // Подсказка: если площадка умеет искать внутри источника (VK wall.search), можно сузить.
  // Можно игнорировать и отдать все посты за период — отбор всё равно делает ML.
  repeated string keywords = 5;
  // Ограничение, чтобы не выкачивать годовой архив. 0 = по умолчанию (300).
  uint32 max_posts = 6;
}

message CollectFromSourceResponse {
  repeated RawPost posts = 1;
  // true — упёрлись в max_posts, за период есть ещё
  bool truncated = 2;
  // Нефатальные проблемы: «у 3 постов нет даты», «часть страниц не загрузилась»
  repeated string warnings = 3;
}

message SearchPlatformRequest {
  common.v1.RequestContext context = 1;
  common.v1.Platform platform = 2;
  // Поисковые фразы от ML (AnalyzeQuery.search_queries). Каждая ищется отдельно, результаты объединяются.
  repeated string queries = 3;
  common.v1.Period period = 4;
  // Подсказка: термины региона («Красноярск», «Красноярский край», «Норильск», ...).
  // Как keywords, коннектор может её игнорировать и искать по фразам queries как есть:
  // привязку к региону и отбор по смыслу делают ml_service и search_service.
  repeated string region_terms = 5;
  // 0 = по умолчанию (500)
  uint32 max_posts = 6;
}

message SearchPlatformResponse {
  repeated RawPost posts = 1;
  bool truncated = 2;
  repeated string warnings = 3;
}
