syntax = "proto3";

package common.v1;

// Контекст запроса. Заполняет ТОЛЬКО Gateway после проверки JWT.
// Сервисы доверяют этим полям и сами проверяют права.
message RequestContext {
  string request_id = 1;
  // Пусто — анонимный запрос (регистрация, логин).
  string actor_user_id = 2;
  // "user" | "admin"
  string actor_role = 3;
}
