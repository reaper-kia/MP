        platforms: { type: array, items: { $ref: "#/components/schemas/Platform" } }
        source_ids: { type: array, items: { type: string } }
    SearchStatus:
      type: string
      enum: [queued, running, completed, partial, failed, cancelled]
      description: |
        completed + counts.total=0 → «Подходящие публикации не найдены» (показать, где искали).
        partial → подборка + баннер «Не удалось обработать N источников» + «Повторить».
        failed → ошибка + «Повторить».
    SearchStage:
      type: string
      enum: [queued, analyzing_query, collecting, scoring, grouping, done]
      description: "Подписи: Разбираем запрос… / Собираем публикации… / Проверяем связь с запросом… / Группируем…"
