openapi: 3.1.0
info:
  title: MP Медиамониторинг — HTTP API для фронта
  version: 1.0.0
  description: |
    Контракт между frontend и gateway. Фронт пишет код ТОЛЬКО по этому файлу и с первого часа
    работает на моках:

        npx @stoplight/prism-cli@5 mock contracts/http/openapi.yaml -p 4010

    (vite proxy `/api` → `http://localhost:4010`). Для «живого» сценария поиска (queued → running →
    completed) — MSW-моки в `frontend/src/mocks/` (задача FE-02).

    Общие правила:
    - Авторизации нет (по ТЗ регистрация не нужна). Все ручки анонимные.
    - Даты периода — `YYYY-MM-DD` в часовом поясе Asia/Krasnoyarsk, обе границы включительно.
    - Время (`*_at`) — ISO 8601 в UTC; показывать в Asia/Krasnoyarsk.
    - Поле `null` = «недоступно». Фронт показывает «нет данных», а не пустоту и не 0.
    - Ошибка всегда `{"error": {"code", "message", "request_id", "details"}}`; фронт решает по `code`.
    - Пагинация: `limit` + `offset` → `{items, total, has_more}`. Исключение — история поисков
      `GET /searches`: `{items, has_more}` без `total`.
    - Любая ручка может ответить `429 RATE_LIMITED` (площадка ограничила частоту запросов — повторить позже)
      и `501 NOT_IMPLEMENTED` (возможность ещё не включена, например DOCX). Показывать `message` как есть.

    Изменения контракта — только через TL, с поднятием version и сообщением в чат.
servers:
  - url: http://localhost:8000
    description: gateway локально
  - url: http://localhost:4010
    description: Prism mock
tags:
  - name: meta
  - name: sources
  - name: searches
  - name: results

paths:
  /api/v1/platforms:
    get:
      tags: [meta]
      operationId: listPlatforms
      summary: Площадки и их доступность
      description: Показывать в форме поиска (чекбоксы площадок) и в блоке «Охват». Если `status=unavailable` — чекбокс выключен с подсказкой `note`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlatformInfo" }
              example:
                - { code: vk, title: ВКонтакте, source_mode: true, global_mode: true, status: ok, note: null }
                - { code: ok, title: Одноклассники, source_mode: true, global_mode: true, status: degraded, note: Глобальный поиск через Яндекс — покрытие неполное }
                - { code: max, title: MAX, source_mode: true, global_mode: false, status: degraded, note: Поиск только по каналам из списка }
                - { code: news, title: Новостные сайты, source_mode: true, global_mode: false, status: ok, note: Сайты из перечня агентства }

  /api/v1/query/analyze:
    post:
      tags: [meta]
      operationId: analyzeQuery
      summary: Как система поняла запрос (подсказка до запуска)
      description: Вызывать с debounce ~800 мс после ввода. Показывать `summary` и тип запроса; если `needs_clarification` — мягкую подсказку `clarification_hint`. Не блокирует кнопку «Найти».
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueryAnalyzeIn" }
            example: { query: Безопасность дорожного движения в Красноярском крае }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryAnalysis" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/sources:
    get:
      tags: [sources]
      operationId: listSources
      summary: Каталог источников
      parameters:
        - { name: platform, in: query, schema: { type: array, items: { $ref: "#/components/schemas/Platform" } }, style: form, explode: true }
        - { name: q, in: query, schema: { type: string }, description: Поиск по названию/ссылке }
        - { name: is_active, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourcePage" }
    post:
      tags: [sources]
      operationId: createSource
      summary: Добавить источник по ссылке
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceCreateIn" }
            example: { url: "https://vk.com/krsk_news", is_regional: true }
      responses:
        "201":
          description: Создан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/sources/resolve:
    post:
      tags: [sources]
      operationId: resolveSource
      summary: Предпросмотр источника по ссылке (до сохранения)
      description: Пользователь вставил ссылку → показываем название, площадку, город, и если уже есть в каталоге — «Уже в списке».
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceResolveIn" }
            example: { url: "vk.com/krsk_news" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourcePreview" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/sources/import:
    post:
      tags: [sources]
      operationId: importSources
      summary: "[необязательно] Импорт списка из Excel"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: ".xlsx: A — ссылка, B — название, C — региональный (да/нет)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceImportReport" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/sources/{source_id}:
    parameters:
      - { name: source_id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [sources]
      operationId: updateSource
      summary: Изменить источник (название, флаги, заметка)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceUpdateIn" }
            example: { is_active: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [sources]
      operationId: deleteSource
      summary: Удалить источник (мягко — история поисков сохраняет снимок)
      responses:
        "204": { description: Удалён }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/searches:
    post:
      tags: [searches]
      operationId: startSearch
      summary: Запустить поиск
      description: |
        Возвращает задачу сразу (`status=queued`). Дальше фронт опрашивает `GET /searches/{id}`
        каждые 1.5 с, пока `status` не станет одним из `completed | partial | failed | cancelled`.
        id текущего поиска держать в URL (`/search/<id>`) — так подборка всегда привязана к своим параметрам.

        `mode=selected`: ищем только по `source_ids`, площадки берутся из самих источников, а `platforms`
        игнорируется (передавайте площадки этих источников). `mode=global`: `source_ids` пустой, ищем по
        всей площадке из `platforms` и по активным источникам каталога.

        Кэш (B2-20): такой же поиск (тот же запрос без учёта регистра и лишних пробелов, период, режим,
        площадки / источники) уже завершился за последние 30 минут → в ответе сразу копия готовой
        подборки: новый `id`, финальный `status`, `cache.from_search_id` и `cache.created_at` (когда
        собрана). Показать плашку «Подборка из кэша · собрана N мин назад · Обновить»; «Обновить»
        и «Повторить» шлют `fresh=true` — настоящий поиск мимо кэша.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchCreateIn" }
            examples:
              selected:
                summary: По выбранным источникам
                value:
                  query: Безопасность дорожного движения в Красноярском крае
                  period_from: "2026-10-01"
                  period_to: "2026-10-19"
                  mode: selected
                  platforms: [vk, ok, max]
                  source_ids: ["5b0e2f6e-1c1a-4c47-9a39-6a1b2f0b0a01", "5b0e2f6e-1c1a-4c47-9a39-6a1b2f0b0a02"]
              global:
                summary: Без ограничения списком
                value:
                  query: Безопасность дорожного движения в Красноярском крае
                  period_from: "2026-10-01"
                  period_to: "2026-10-19"
                  mode: global
                  platforms: [vk, ok, max]
                  source_ids: []
      responses:
        "202":
          description: Принят в работу
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Search" }
              example:
                id: 9d1f6a38-8a7c-4c1e-b7f4-2f1d3c4b5a60
                status: queued
                stage: queued
                progress: { targets_total: 0, targets_finished: 0, percent: 0 }
                params:
                  query: Безопасность дорожного движения в Красноярском крае
                  query_type: null
                  period_from: "2026-10-01"
                  period_to: "2026-10-19"
                  mode: global
                  platforms: [vk, ok, max]
                  source_ids: []
                query_analysis: null
                targets: []
                counts: { total: 0, direct: 0, indirect: 0, disputed: 0, rejected: 0, excluded: 0, unknown_date: 0, groups: 0 }
                warnings: []
                created_at: "2026-10-19T05:10:00Z"
                started_at: null
                finished_at: null
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      tags: [searches]
      operationId: listSearches
      summary: История поисков
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchSummaryPage" }

  /api/v1/searches/{search_id}:
    parameters:
      - { $ref: "#/components/parameters/SearchId" }
    get:
      tags: [searches]
      operationId: getSearch
      summary: Статус, охват и счётчики поиска
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Search" }
              examples:
                running: { $ref: "#/components/examples/SearchRunning" }
                partial: { $ref: "#/components/examples/SearchPartial" }
                empty: { $ref: "#/components/examples/SearchEmpty" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/searches/{search_id}/retry:
    parameters:
      - { $ref: "#/components/parameters/SearchId" }
    post:
      tags: [searches]
      operationId: retrySearch
      summary: Повторить упавшие источники
      description: Найденное раньше сохраняется. Кнопка «Повторить» у каждой упавшей цели и общая «Повторить все неудачные».
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                target_ids: { type: array, items: { type: string }, description: "Пусто — все failed" }
      responses:
        "202":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Search" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/searches/{search_id}/cancel:
    parameters:
      - { $ref: "#/components/parameters/SearchId" }
    post:
      tags: [searches]
      operationId: cancelSearch
      summary: Остановить поиск (незавершённые источники → skipped)
      description: Если поиск уже завершён (`completed | partial | failed | cancelled`) — ничего не меняет, отвечает 200 с текущим состоянием, не ошибкой.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Search" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/searches/{search_id}/results:
    parameters:
      - { $ref: "#/components/parameters/SearchId" }
    get:
      tags: [results]
      operationId: listResults
      summary: Подборка (плоский список)
      description: Можно запрашивать во время `running` — результаты появляются по мере обработки.
      parameters:
        - { $ref: "#/components/parameters/RelevanceFilter" }
        - { $ref: "#/components/parameters/PlatformFilter" }
        - { $ref: "#/components/parameters/TargetFilter" }
        - { $ref: "#/components/parameters/DateStatusFilter" }
        - { $ref: "#/components/parameters/IncludeExcluded" }
        - { $ref: "#/components/parameters/Sort" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResultPage" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/searches/{search_id}/groups:
    parameters:
      - { $ref: "#/components/parameters/SearchId" }
    get:
      tags: [results]
      operationId: listGroups
      summary: Подборка, сгруппированная по сюжетам
      description: Одна новость в трёх группах = 1 сюжет из 3 размещений; в счётчике это 3 публикации. Все ссылки доступны внутри группы.
      parameters:
        - { $ref: "#/components/parameters/RelevanceFilter" }
        - { $ref: "#/components/parameters/PlatformFilter" }
        - { $ref: "#/components/parameters/TargetFilter" }
        - { $ref: "#/components/parameters/DateStatusFilter" }
        - { $ref: "#/components/parameters/IncludeExcluded" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupPage" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/searches/{search_id}/results/exclusion:
    parameters:
      - { $ref: "#/components/parameters/SearchId" }
    post:
      tags: [results]
      operationId: setExcluded
      summary: Исключить / вернуть публикации (одну, несколько или всю группу)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExclusionIn" }
            example: { result_ids: ["r-3"], excluded: true }
      responses:
        "200":
          description: Пересчитанные счётчики
          content:
            application/json:
              schema:
                type: object
                required: [counts]
                properties:
                  counts: { $ref: "#/components/schemas/SearchCounts" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/searches/{search_id}/export:
    parameters:
      - { $ref: "#/components/parameters/SearchId" }
    get:
      tags: [results]
      operationId: exportSearch
      summary: Выгрузка XLSX (обязательно) / DOCX (по желанию)
      description: Передавать те же фильтры и сортировку, что на экране — файл должен совпадать с показанной подборкой. Исключённые не выгружаются. Скачивать через `<a href download>`.
      parameters:
        - { name: format, in: query, required: true, schema: { type: string, enum: [xlsx, docx] } }
        - { $ref: "#/components/parameters/RelevanceFilter" }
        - { $ref: "#/components/parameters/PlatformFilter" }
        - { $ref: "#/components/parameters/TargetFilter" }
        - { $ref: "#/components/parameters/DateStatusFilter" }
        - { $ref: "#/components/parameters/Sort" }
      responses:
        "200":
          description: Файл
          headers:
            Content-Disposition:
              schema: { type: string }
              example: attachment; filename="podborka_2026-10-19.xlsx"
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

components:
  parameters:
    SearchId: { name: search_id, in: path, required: true, schema: { type: string, format: uuid } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    Offset: { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    RelevanceFilter:
      name: relevance
      in: query
      description: "По умолчанию direct+indirect+disputed. `rejected` — вкладка «Отсеяно системой»."
      schema: { type: array, items: { $ref: "#/components/schemas/Relevance" } }
      style: form
      explode: true
    PlatformFilter:
      name: platform
      in: query
      schema: { type: array, items: { $ref: "#/components/schemas/Platform" } }
      style: form
      explode: true
    TargetFilter:
      name: target_id
      in: query
      description: Показать найденное в конкретном источнике (клик по строке в «Охвате»)
      schema: { type: array, items: { type: string } }
      style: form
      explode: true
    DateStatusFilter:
      name: date_status
      in: query
      schema: { type: array, items: { $ref: "#/components/schemas/DateStatus" } }
      style: form
      explode: true
    IncludeExcluded: { name: include_excluded, in: query, schema: { type: boolean, default: false } }
    Sort: { name: sort, in: query, schema: { type: string, enum: [relevance, date_desc, date_asc], default: relevance } }

  responses:
    ValidationError:
      description: Неверные данные (SEARCH_INVALID_PARAMS, UNSUPPORTED_URL, VALIDATION_ERROR)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: { code: SEARCH_INVALID_PARAMS, message: Дата начала позже даты окончания, request_id: 7f3c2a, details: [{ field: period_from, message: "Должна быть не позже period_to" }] }
    NotFound:
      description: Не найдено (SEARCH_NOT_FOUND, SOURCE_NOT_FOUND, RESULT_NOT_FOUND)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: { code: SOURCE_NOT_FOUND, message: Группа не найдена на площадке, request_id: 7f3c2a, details: [] }
    Conflict:
      description: Конфликт (SOURCE_ALREADY_EXISTS, SEARCH_NOT_FINISHED)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: { code: SOURCE_ALREADY_EXISTS, message: Источник уже есть в списке, request_id: 7f3c2a, details: [] }
    RateLimited:
      description: Площадка ограничила частоту запросов (RATE_LIMITED) — повторить позже
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: { code: RATE_LIMITED, message: Превышен лимит запросов к площадке, request_id: 7f3c2a, details: [] }
    NotImplemented:
      description: Возможность ещё не включена (NOT_IMPLEMENTED), например выгрузка в DOCX
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: { code: NOT_IMPLEMENTED, message: Выгрузка в DOCX пока недоступна, request_id: 7f3c2a, details: [] }
    Unavailable:
      description: Площадка или сервис недоступны (PLATFORM_UNAVAILABLE, SERVICE_UNAVAILABLE)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: { code: PLATFORM_UNAVAILABLE, message: Одноклассники сейчас недоступны, request_id: 7f3c2a, details: [] }

  schemas:
    Platform:
      type: string
      enum: [vk, ok, max, news]
    Relevance:
      type: string
      enum: [direct, indirect, disputed, rejected]
      description: "direct — прямо по запросу; indirect — косвенно; disputed — спорно, проверить; rejected — отсеяно системой (не в подборке)"
    DateStatus:
      type: string
      enum: [in_period, unknown]
    QueryType:
      type: string
      enum: [topic, event, person, news_text]

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, details]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            details: { type: array, items: { type: object } }

    PlatformInfo:
      type: object
      required: [code, title, source_mode, global_mode, status, note]
      properties:
        code: { $ref: "#/components/schemas/Platform" }
        title: { type: string }
        source_mode: { type: boolean, description: Поддерживает поиск по выбранным источникам }
        global_mode: { type: boolean, description: Поддерживает поиск по всей площадке }
        status: { type: string, enum: [ok, degraded, unavailable] }
        note: { type: [string, "null"] }

    QueryAnalyzeIn:
      type: object
      required: [query]
      properties:
