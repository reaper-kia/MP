syntax = "proto3";

package contracts.auth.v1;

import "contracts/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // Пустой user_id — вернуть текущего пользователя (actor из контекста).
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
}

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_USER = 1;
  USER_ROLE_ADMIN = 2;
}

message User {
  string id = 1;
  string email = 2;
  string name = 3;
  UserRole role = 4;
  google.protobuf.Timestamp created_at = 5;
}

message TokenPair {
  string access_token = 1;
  string refresh_token = 2;
  google.protobuf.Timestamp access_expires_at = 3;
  google.protobuf.Timestamp refresh_expires_at = 4;
}

message RegisterRequest {
  contracts.common.v1.RequestContext context = 1;
  string email = 2;
  string name = 3;
  string password = 4;
}

message RegisterResponse {
  User user = 1;
  TokenPair tokens = 2;
}

message LoginRequest {
  contracts.common.v1.RequestContext context = 1;
  string email = 2;
  string password = 3;
}

message LoginResponse {
  User user = 1;
  TokenPair tokens = 2;
}

message RefreshRequest {
  contracts.common.v1.RequestContext context = 1;
  string refresh_token = 2;
}

message RefreshResponse {
  TokenPair tokens = 1;
}

message LogoutRequest {
  contracts.common.v1.RequestContext context = 1;
  string refresh_token = 2;
}

message LogoutResponse {}

message GetUserRequest {
  contracts.common.v1.RequestContext context = 1;
  string user_id = 2;
}

message GetUserResponse {
  User user = 1;
}
