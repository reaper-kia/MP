syntax = "proto3";

package contracts.example.v1;

import "contracts/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

// Образец сервиса: CRUD сущности Item + межсервисный вызов в Auth (имя владельца).
// На хакатоне: `make new-service name=orders` создаст такой же каркас под твою сущность.
service ExampleService {
  rpc CreateItem(CreateItemRequest) returns (CreateItemResponse);
  rpc GetItem(GetItemRequest) returns (GetItemResponse);
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse);
  rpc UpdateItem(UpdateItemRequest) returns (UpdateItemResponse);
  rpc DeleteItem(DeleteItemRequest) returns (DeleteItemResponse);
}

enum ItemStatus {
  ITEM_STATUS_UNSPECIFIED = 0;
  ITEM_STATUS_OPEN = 1;
  ITEM_STATUS_DONE = 2;
}

message Item {
  string id = 1;
  string owner_id = 2;
  // Заполняется только в GetItem — данные из Auth. Пусто, если Auth недоступен.
  string owner_name = 3;
  string title = 4;
  string description = 5;
  ItemStatus status = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message CreateItemRequest {
  contracts.common.v1.RequestContext context = 1;
  string title = 2;
  string description = 3;
}

message CreateItemResponse {
  Item item = 1;
}

message GetItemRequest {
  contracts.common.v1.RequestContext context = 1;
  string item_id = 2;
}

message GetItemResponse {
  Item item = 1;
}

message ListItemsRequest {
  contracts.common.v1.RequestContext context = 1;
  contracts.common.v1.PageRequest page = 2;
  // UNSPECIFIED — без фильтра.
  ItemStatus status = 3;
}

message ListItemsResponse {
  repeated Item items = 1;
  contracts.common.v1.PageInfo page = 2;
}

message UpdateItemRequest {
  contracts.common.v1.RequestContext context = 1;
  string item_id = 2;
  // optional — чтобы отличить "не менять" от "сделать пустым".
  optional string title = 3;
  optional string description = 4;
  ItemStatus status = 5;
}

message UpdateItemResponse {
  Item item = 1;
}

message DeleteItemRequest {
  contracts.common.v1.RequestContext context = 1;
  string item_id = 2;
}

message DeleteItemResponse {}
