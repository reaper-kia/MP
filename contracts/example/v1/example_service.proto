syntax = "proto3";

package example.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";

// Образец сервиса: CRUD Item + вызов AuthService (имя владельца).
service ExampleService {
  rpc CreateItem(CreateItemRequest) returns (CreateItemResponse);
  rpc GetItem(GetItemRequest) returns (GetItemResponse);
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse);
  rpc UpdateItem(UpdateItemRequest) returns (UpdateItemResponse);
  rpc DeleteItem(DeleteItemRequest) returns (DeleteItemResponse);
}

enum ItemStatus {
  ITEM_STATUS_UNSPECIFIED = 0;
  ITEM_STATUS_OPEN = 1;
  ITEM_STATUS_DONE = 2;
}

message Item {
  string id = 1;
  string owner_id = 2;
  // Заполняется в GetItem данными из AuthService. Пусто, если auth недоступен.
  string owner_name = 3;
  string title = 4;
  string description = 5;
  ItemStatus status = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message CreateItemRequest {
  common.v1.RequestContext context = 1;
  string title = 2;
  string description = 3;
}

message CreateItemResponse {
  Item item = 1;
}

message GetItemRequest {
  common.v1.RequestContext context = 1;
  string item_id = 2;
}

message GetItemResponse {
  Item item = 1;
}

message ListItemsRequest {
  common.v1.RequestContext context = 1;
  uint32 limit = 2;
  uint32 offset = 3;
}

message ListItemsResponse {
  repeated Item items = 1;
  // Есть ли ещё записи после этой страницы
  bool has_more = 2;
}

message UpdateItemRequest {
  common.v1.RequestContext context = 1;
  string item_id = 2;
  // optional — чтобы отличать "не менять" от "сделать пустым"
  optional string title = 3;
  optional string description = 4;
  ItemStatus status = 5;
}

message UpdateItemResponse {
  Item item = 1;
}

message DeleteItemRequest {
  common.v1.RequestContext context = 1;
  string item_id = 2;
}

message DeleteItemResponse {}
