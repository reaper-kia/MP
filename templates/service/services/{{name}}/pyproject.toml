[project]
name = "{{project}}"
version = "0.1.0"
description = "TODO: зона ответственности сервиса {{name}}"
requires-python = ">=3.13"
dependencies = [
    "platform-common",
    "mp-contracts",
]

[project.scripts]
{{project}} = "{{name}}_service.main:main"

[tool.uv.sources]
platform-common = { workspace = true }
mp-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
