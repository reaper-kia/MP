[project]
name = "gateway"
version = "0.1.0"
description = "HTTP/WebSocket вход: JWT, RequestContext, маппинг ошибок, проксирование в gRPC"
requires-python = ">=3.13"
dependencies = [
    "platform-common",
    "mp-contracts",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
gateway = "gateway.main:run"

[tool.uv.sources]
platform-common = { workspace = true }
mp-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
