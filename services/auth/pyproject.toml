[project]
name = "auth-service"
version = "0.1.0"
description = "Пользователи, пароли, JWT access + refresh-сессии"
requires-python = ">=3.13"
dependencies = [
    "platform-common",
    "mp-contracts",
    "argon2-cffi>=25.1.0",
]

[project.scripts]
auth-service = "auth_service.main:main"

[tool.uv.sources]
platform-common = { workspace = true }
mp-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
