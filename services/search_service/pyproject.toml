[project]
name = "search-service"
version = "0.1.0"
[tool.hatch.build.targets.wheel]
# Явно указываем имена папок-пакетов, которые лежат в корне platform_contracts
packages = ["collector", "ml", "search", "common"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "grpcio>=1.67",
    "grpcio-tools>=1.67",
    "protobuf>=5.28",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "structlog>=24.4",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "fakeredis>=2.26"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]