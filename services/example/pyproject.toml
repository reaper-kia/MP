[project]
name = "example-service"
version = "0.1.0"
description = "Образец сервиса: CRUD Item, вызов Auth по gRPC, consumer Kafka"
requires-python = ">=3.13"
dependencies = [
    "platform-common",
    "mp-contracts",
]

[project.scripts]
example-service = "example_service.main:main"

[tool.uv.sources]
platform-common = { workspace = true }
mp-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
